<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>CamStok</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#14212b;--mute:#66767f;--line:#d5dde2;--head:#14212b;--headtx:#fff;--ok:#e7f3ef;--oktx:#0b6b58;--low:#fde3d8;--lowtx:#a8330d;--none:#f7f9fa;--acc:#0f8f7a;--acctx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161c;--card:#16222b;--ink:#e8eff3;--mute:#8da0ab;--line:#2a3a45;--head:#0a1116;--headtx:#e8eff3;--ok:#14352e;--oktx:#6fd6bd;--low:#4a2316;--lowtx:#ff9d78;--none:#121c23;--acc:#2bb9a1;--acctx:#04231d}}
:root[data-theme="dark"]{--bg:#0e161c;--card:#16222b;--ink:#e8eff3;--mute:#8da0ab;--line:#2a3a45;--head:#0a1116;--headtx:#e8eff3;--ok:#14352e;--oktx:#6fd6bd;--low:#4a2316;--lowtx:#ff9d78;--none:#121c23;--acc:#2bb9a1;--acctx:#04231d}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;padding-bottom:70px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:10}
header{background:var(--head);color:var(--headtx);padding:14px 16px 12px}
h1{margin:0 0 10px;font-size:20px;font-weight:700;letter-spacing:.2px}
h1 small{font-weight:400;opacity:.7;font-size:13px;margin-left:8px}
.chips{display:flex;gap:8px;overflow-x:auto}
.chip{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--headtx);border-radius:20px;padding:6px 14px;font:inherit;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acctx);font-weight:700}
main{padding:12px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:8px 14px;font:inherit}
.seg button.on{background:var(--acc);color:var(--acctx);font-weight:700}
.hint{color:var(--mute);font-size:13px}
.wrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{min-width:44px;height:38px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;font-size:14px}
thead th{position:sticky;top:0;background:var(--head);color:var(--headtx);z-index:2;font-weight:600;font-size:12px}
tbody th{position:sticky;left:0;background:var(--head);color:var(--headtx);z-index:1;font-size:12px;min-width:54px}
thead th:first-child{left:0;z-index:3}
td{background:var(--none);cursor:pointer}
td.ok{background:var(--ok);color:var(--oktx);font-weight:600}
td.low{background:var(--low);color:var(--lowtx);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sum{display:flex;gap:18px;margin-bottom:10px}
.sum b{font-size:26px;display:block;line-height:1.1}
.sum span{color:var(--mute);font-size:13px}
.list{width:100%}
.list td,.list th{height:34px;background:none;cursor:default;position:static;color:var(--ink);font-weight:400}
.list thead th{background:var(--head);color:var(--headtx);position:static}
.list td:last-child,.list th:last-child{border-right:0}
.list td.q{font-weight:700;color:var(--lowtx)}
.btn{border:0;background:var(--acc);color:var(--acctx);border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
input[type=number],input[type=text]{width:90px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;text-align:center}
input[type=text]{width:160px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:14px 0;font:inherit}
nav button.on{color:var(--acc);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.panel{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.panel h2{margin:0 0 4px;font-size:20px}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.step button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:30px}
.step input{width:90px;height:64px;font-size:28px;font-weight:700}
.empty{color:var(--mute);text-align:center;padding:26px 8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;display:none;z-index:30}
.mode{background:var(--low);color:var(--lowtx);padding:8px 12px;border-radius:10px;margin-bottom:10px;font-weight:700}.find{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.find input{width:80px}#res{font-weight:700}textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.3 ui-monospace,Menlo,monospace;padding:8px;margin-top:8px}.btn.sm{padding:7px 12px;font-size:14px}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}details.card[open] summary{margin-bottom:4px}
td.ex{outline:2px dashed var(--mute);outline-offset:-3px}
/* --- Masaüstü eklemeleri --- */
.notice{background:var(--low);color:var(--lowtx);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.notice b{display:block;margin-bottom:4px}
.path{font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);word-break:break-all;margin-top:6px}
.btn{cursor:pointer}.btn.alt:hover,.seg button:hover,.chip:hover{filter:brightness(.96)}
nav button,.chip,.seg button{cursor:pointer}
h1 small.err{color:#ff9d78;opacity:1;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>CamStok<small id="st">Otomatik kaydediliyor</small></h1>
  <div class="chips" id="chips"></div>
</header>
<main id="main"><div class="empty">Yükleniyor…</div></main>
<nav>
  <button data-t="stok" class="on">Stok</button>
  <button data-t="siparis">Sipariş</button>
  <button data-t="gecmis">Geçmiş</button>
  <button data-t="ayar">Ayarlar</button>
</nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
